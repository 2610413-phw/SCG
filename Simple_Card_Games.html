<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Card Games</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for P2P networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            overscroll-behavior: none; /* Prevent pull-to-refresh on tablets */
            user-select: none; /* Prevent text selection while tapping */
            -webkit-user-select: none;
        }

        /* Poker Table Green Gradient */
        .bg-poker-table {
            background: radial-gradient(circle, #2d5a27 0%, #153112 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* Static playing cards: no flip/rotation interaction */
        .playing-card {
            width: 60px;
            height: 90px;
            position: relative;
        }
        @media (min-width: 768px) {
            .playing-card { width: 80px; height: 120px; }
        }

        .playing-card.deal-in {
            animation: dealIn 420ms cubic-bezier(.2,.8,.2,1) both;
            animation-delay: var(--deal-delay, 0ms);
        }
        @keyframes dealIn {
            from { opacity: 0; transform: translateY(-28px) scale(.72) rotate(-7deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .playing-card.deal-in { animation: none; }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: white;
        }
        @media (min-width: 768px) {
            .card-face { font-size: 2rem; }
        }

        .card-back {
            background: linear-gradient(135deg, #1e3a8a 25%, #1e40af 25%, #1e40af 50%, #1e3a8a 50%, #1e3a8a 75%, #1e40af 75%, #1e40af 100%);
            background-size: 20px 20px;
            border: 2px solid white;
        }

        .text-red { color: #dc2626; }
        .text-black { color: #171717; }

        /* Card face: keep corner indices comfortably inside the card. */
        .card-front { position: relative; overflow: hidden; }
        .card-corner { position: absolute; top: 7px; left: 7px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size: .85rem; line-height:1; }
        .card-corner.bottom { top:auto; left:auto; right:7px; bottom:7px; transform:rotate(180deg); }
        .card-center-suit { font-size: 2.1rem; }
        @media (min-width:768px) { .card-corner { top:9px; left:9px; font-size:1rem; } .card-corner.bottom {top:auto;left:auto;right:9px;bottom:9px;} .card-center-suit {font-size:2.8rem;} }
        #screen-game[data-mode="onecard"] > #opponentsArea,
        #screen-game[data-mode="onecard"] > .absolute.top-1\/2,
        #screen-game[data-mode="onecard"] > .min-h-\[12rem\],
        #screen-game[data-mode="blackjack"] > #opponentsArea,
        #screen-game[data-mode="blackjack"] > .absolute.top-1\/2,
        #screen-game[data-mode="blackjack"] > .min-h-\[12rem\] { display:none !important; }
        #otherGameUI { display:none; }
        #screen-game[data-mode="onecard"] #otherGameUI,
        #screen-game[data-mode="blackjack"] #otherGameUI { display:flex; }
        .mini-card { width:54px;height:80px; flex:none; }
        .mini-card .card-face {font-size:1.2rem;}
        .game-action {padding:11px 16px;border-radius:10px;font-weight:800;}
        /* Other games have their own controls inside #otherGameUI.
           Hide the poker-only absolute controls to prevent duplicate/overlapping buttons. */
        #screen-game[data-mode="onecard"] > button[onclick="openHelp()"],
        #screen-game[data-mode="onecard"] > button[onclick="leaveGame()"],
        #screen-game[data-mode="blackjack"] > button[onclick="openHelp()"],
        #screen-game[data-mode="blackjack"] > button[onclick="leaveGame()"] { display:none !important; }
        #otherGameUI { box-sizing:border-box; min-width:0; }
        .other-game-header { flex:0 0 auto; min-width:0; }
        .other-game-header-actions { align-items:center; }
        #myGameCards { align-items:center; }
        .mini-card { display:block; padding:0; border:0; background:transparent; cursor:pointer; touch-action:manipulation; }
        .mini-card:disabled { cursor:not-allowed; }
        .mini-card .playing-card { pointer-events:none; }
        @media(max-width:600px){
            .mini-card{width:44px;height:66px}
            .mini-card .card-face{font-size:1rem}
            .game-action{padding:10px 12px;font-size:.85rem}
            .other-game-header { align-items:flex-start; }
            .other-game-header-actions { gap:6px; }
            .other-game-header-actions .game-action { padding:9px 10px; font-size:.82rem; white-space:nowrap; }
            #otherGameUI { padding:12px; gap:10px; }
        }
        @media (orientation:landscape) and (max-height:600px) {
            #otherGameUI { padding:8px 14px; gap:8px; }
            #otherGameUI .rounded-2xl { padding:8px; }
            #otherGameUI #myGameCards { min-height:58px; }
            .mini-card { width:38px; height:56px; }
            .mini-card .card-face { font-size:.9rem; }
        }

        .chip {
            background: repeating-linear-gradient(45deg, #fbbf24, #fbbf24 5px, #f59e0b 5px, #f59e0b 10px);
            border: 2px dashed #b45309;
        }

        /* Scrollbar hiding for lobby list */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Disable buttons */
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Fix for dynamic viewport height and system navigation bar */
        html, body {
            height: 100%;
            height: 100dvh;
        }

        .safe-pb {
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        /* Portrait tablet / phone layout */
        @media (orientation: portrait) {
            #screen-game {
                justify-content: flex-start;
                overflow: hidden;
            }
            #opponentsArea {
                flex: 1 1 auto;
                min-height: 0;
                max-height: 30%;
                overflow: hidden;
                padding: 10px 8px;
                gap: 8px;
                align-content: flex-start;
            }
            #opponentsArea > div {
                padding: 8px;
                width: auto;
                min-width: 88px;
                max-width: 30%;
            }
            #opponentsArea .playing-card {
                width: 34px;
                height: 51px;
            }
            #opponentsArea .card-face { font-size: 1rem; }

            #screen-game > .absolute.top-1\/2 {
                top: 42%;
                width: 100%;
                padding: 0 8px;
            }
            #screen-game > .absolute.top-1\/2 > div:first-child {
                margin-bottom: 8px;
                padding: 5px 12px;
            }
            #communityCardsArea { gap: 5px; justify-content: center; }
            #communityCardsArea .playing-card {
                width: clamp(34px, 8vw, 54px);
                height: clamp(51px, 12vw, 81px);
            }
            #communityCardsArea .card-face { font-size: clamp(1rem, 3vw, 1.4rem); }

            #screen-game > div:last-child:not(#systemMessage) { box-sizing: border-box; }
            #screen-game > .min-h-\[12rem\] {
                min-height: 0;
                max-height: 46%;
                flex: 0 0 auto;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-end;
                gap: 10px;
                padding: 12px 12px max(14px, env(safe-area-inset-bottom));
            }
            #screen-game > .min-h-\[12rem\] > div:first-child {
                max-width: 58%;
                margin: 0;
            }
            #myNameDisplay { font-size: 1rem; }
            #myChipsDisplay { font-size: 1rem; }
            #myHandRank { font-size: 0.8rem; }
            #myCardsArea {
                left: auto;
                right: 12px;
                top: 12px;
                bottom: auto;
                transform: none;
                gap: 6px;
            }
            #myCardsArea .playing-card {
                width: clamp(42px, 10vw, 58px);
                height: clamp(63px, 15vw, 87px);
            }
            #myCardsArea .card-face { font-size: 1.25rem; }
            #screen-game > .min-h-\[12rem\] > div:last-child {
                width: 100%;
                gap: 6px;
            }
            #actionButtons {
                width: 100%;
                justify-content: stretch;
                gap: 6px;
            }
            #actionButtons > button,
            #actionButtons > div > button {
                padding: 10px 9px;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            #actionButtons > div { flex: 1 1 auto; min-width: 0; gap: 5px; }
            #betAmount { width: 66px; padding: 9px 4px; }
            #screen-game > .min-h-\[12rem\] > div:last-child > div:nth-child(2),
            #screen-game > .min-h-\[12rem\] > div:last-child > div:nth-child(3) {
                font-size: 0.68rem;
            }
            #systemMessage {
                top: 30%;
                max-width: 90%;
                white-space: normal;
                font-size: 0.95rem;
            }
        }

        @media (orientation: portrait) and (max-height: 700px) {
            #opponentsArea { max-height: 24%; }
            #screen-game > .min-h-\[12rem\] { max-height: 52%; }
            #screen-game > .absolute.top-1\/2 { top: 38%; }
        }
    </style>
</head>
<body class="w-screen overflow-hidden flex items-center justify-center">

    <!-- LOBBY SCREEN -->
    <div id="screen-lobby" class="w-full h-full flex flex-col items-center justify-center p-6 bg-gray-900 transition-opacity duration-300">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-green-400 mb-2">Simple Card Game️s</h1>
            <p class="text-gray-400 mb-8 text-sm">P2P 연결 방식 지원</p>

            <div class="space-y-4">
                <button onclick="openHelp()" class="w-full bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-lg">게임 규칙 / 도움말</button>
                <input type="text" id="playerName" placeholder="내 이름 (닉네임)" class="w-full p-4 rounded-lg bg-gray-700 text-white border-2 border-gray-600 focus:border-green-400 focus:outline-none text-lg font-semibold text-center" maxlength="8">
                <select id="gameTypeSelect" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 font-bold">
                    <option value="poker">텍사스 홀덤 포커</option>
                    <option value="onecard">원카드</option>
                    <option value="blackjack">블랙잭</option>
                </select>
                
                <div class="border-t border-gray-700 my-4 pt-4">
                    <button onclick="createRoom()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-lg shadow-lg mb-4 transition">
                        방 만들기 (방장)
                    </button>
                    
                    <div class="flex space-x-2">
                        <input type="text" id="roomCodeInput" placeholder="방 코드 (4자리)" class="w-1/2 p-4 rounded-lg bg-gray-700 text-white border-2 border-gray-600 focus:border-blue-400 focus:outline-none text-center font-bold uppercase" maxlength="4">
                        <button onclick="joinRoom()" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg shadow-lg transition">
                            방 접속하기
                        </button>
                    </div>
                </div>
            </div>

            <div id="lobbyStatus" class="mt-4 text-sm text-yellow-400 h-6"></div>
        </div>
    </div>

    <!-- WAITING ROOM SCREEN -->
    <div id="screen-waiting" class="hidden w-full h-full flex flex-col items-center justify-center p-6 bg-gray-900">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg text-center">
            <div class="flex items-center justify-center gap-3 mb-2"><h2 class="text-2xl font-bold text-white">대기실</h2><button onclick="openHelp()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-sm font-bold px-3 py-2 rounded-lg">도움말</button></div>
            <div id="roomCodeDisplayContainer" class="hidden mb-6">
                <p class="text-gray-400 text-sm mb-1">이 코드를 친구들에게 공유하세요</p>
                <div class="text-5xl font-extrabold text-green-400 tracking-widest bg-gray-900 py-3 rounded-lg border border-gray-700" id="roomCodeDisplay">ABCD</div>
            </div>
            
            <div class="bg-gray-700 rounded-lg p-4 h-48 overflow-y-auto no-scrollbar mb-6">
                <h3 class="text-left text-sm text-gray-400 mb-2 border-b border-gray-600 pb-1">접속한 플레이어</h3>
                <ul id="playerList" class="text-left space-y-2 text-lg font-semibold">
                    <!-- Players will be injected here -->
                </ul>
            </div>

            <button id="btnStartGame" onclick="startGame()" class="hidden w-full bg-gradient-to-r from-green-500 to-green-700 hover:from-green-400 hover:to-green-600 text-white font-bold py-4 rounded-lg shadow-lg transition text-xl">
                게임 시작
            </button>
            <p id="waitingMessage" class="text-gray-400">방장이 게임을 시작할 때까지 대기중...</p>
            <button onclick="leaveGame()" class="mt-5 bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-5 rounded-lg">나가기</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" data-mode="poker" class="hidden w-full h-full bg-poker-table flex flex-col justify-between relative">
        <div id="otherGameUI" class="absolute inset-0 z-20 flex-col p-3 sm:p-6 gap-3 overflow-y-auto">
            <div class="other-game-header flex items-center justify-between gap-2">
                <div class="min-w-0"><div id="otherGameTitle" class="text-xl sm:text-2xl font-extrabold">게임</div><div id="otherGameStatus" class="text-sm text-green-200">대기 중</div></div>
                <div class="other-game-header-actions flex gap-2 shrink-0"><button onclick="openHelp()" class="game-action bg-indigo-700 hover:bg-indigo-600">도움말</button><button onclick="leaveGame()" class="game-action bg-red-700 hover:bg-red-600">나가기</button></div>
            </div>
            <div id="otherPlayers" class="flex flex-wrap justify-center gap-2"></div>
